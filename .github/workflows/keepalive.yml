# Keeps the free Supabase project from pausing (it pauses after 7 days with no activity).
# Runs once a day and calls a tiny public "ping" function. Uses only the public key that is already in the website.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST \
            "https://dgboklhxjwhjhyreicgw.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_p48r7zHh-k78C8_0X8L5Sw_e5tE9SqS" \
            -H "Content-Type: application/json" -d '{}')
          cat /tmp/out; echo; echo "HTTP $code"
          test "$code" = "200"
